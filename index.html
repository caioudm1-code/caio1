```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, Caio ✨</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      font-family: Inter, Arial, sans-serif;
      color: white;

      background:
        radial-gradient(circle at 20% 20%, #7c3aed55, transparent 35%),
        radial-gradient(circle at 80% 80%, #06b6d455, transparent 35%),
        #070711;
    }

    /* Luzes de fundo */
    .orb {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .45;
      animation: float 8s ease-in-out infinite;
    }

    .orb.one {
      background: #8b5cf6;
      top: -120px;
      left: -100px;
    }

    .orb.two {
      background: #06b6d4;
      bottom: -150px;
      right: -100px;
      animation-delay: -4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(30px, -20px) scale(1.08);
      }
    }

    /* Card principal */
    .card {
      position: relative;
      width: min(90%, 720px);
      padding: 70px 50px;
      text-align: center;

      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 32px;

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, .45),
        inset 0 1px 0 rgba(255,255,255,.1);

      animation: appear .9s ease-out;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      margin-bottom: 24px;

      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;

      color: #c4b5fd;
      background: rgba(139, 92, 246, .12);
      border: 1px solid rgba(139, 92, 246, .3);
      border-radius: 999px;
    }

    h1 {
      font-size: clamp(48px, 9vw, 90px);
      line-height: .95;
      letter-spacing: -0.06em;
      margin-bottom: 24px;

      background: linear-gradient(
        100deg,
        #fff,
        #c4b5fd,
        #67e8f9
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      animation: glow 4s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        filter: drop-shadow(0 0 8px rgba(167,139,250,.15));
      }

      to {
        filter: drop-shadow(0 0 25px rgba(103,232,249,.25));
      }
    }

    p {
      max-width: 500px;
      margin: 0 auto 35px;

      color: #aaaabd;
      font-size: 18px;
      line-height: 1.7;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding: 14px 22px;

      color: white;
      text-decoration: none;
      font-weight: 600;

      background: linear-gradient(
        135deg,
        #7c3aed,
        #0891b2
      );

      border-radius: 14px;

      box-shadow:
        0 10px 30px rgba(124, 58, 237, .25);

      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 15px 40px rgba(34, 211, 238, .25);
    }

    .footer {
      margin-top: 35px;
      font-size: 12px;
      color: #68687a;
    }

    /* Pequenos brilhos decorativos */
    .spark {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 15px white;
      opacity: .7;
      animation: blink 2s ease-in-out infinite;
    }

    .spark:nth-child(1) {
      top: 15%;
      left: 12%;
    }

    .spark:nth-child(2) {
      top: 25%;
      right: 15%;
      animation-delay: .7s;
    }

    .spark:nth-child(3) {
      bottom: 18%;
      left: 20%;
      animation-delay: 1.2s;
    }

    @keyframes blink {
      0%, 100% {
        opacity: .2;
        transform: scale(.7);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    @media (max-width: 600px) {
      .card {
        padding: 55px 25px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="orb one"></div>
  <div class="orb two"></div>

  <div class="spark"></div>
  <div class="spark"></div>
  <div class="spark"></div>

  <main class="card">

    <div class="badge">
      ✦ Primeiro deploy
    </div>

    <h1>Hello World.</h1>

    <p>
      Um pequeno HTML, agora com uma aparência
      um pouco mais digna de ser apresentada ao Caio.
    </p>

    <a href="#" class="button">
      🚀 Funcionou!
    </a>

    <div class="footer">
      Feito com HTML + CSS · Sem frameworks · Sem frescura
    </div>

  </main>

</body>
</html>
```
